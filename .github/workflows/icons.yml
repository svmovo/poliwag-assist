name: add-icons
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: write icons
        run: |
          mkdir -p icons
          echo '' | base64 -d > icons/icon16.png
          mkdir -p icons
          echo '' | base64 -d > icons/icon32.png
          mkdir -p icons
          echo '' | base64 -d > icons/icon48.png
          mkdir -p icons
          echo '' | base64 -d > icons/icon128.png
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons/
          git commit -m "Add extension icons"
          git push
