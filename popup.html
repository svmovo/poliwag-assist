<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Sam Poliwag Assist</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; width: 320px; background: #18181B; color: #E7E7EA; font: 13px/1.5 "Segoe UI", Inter, system-ui, sans-serif; }
  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 15px; }
  .muted { color: #A1A1AA; font-size: 12px; margin: 0; }
  .host { font-family: Consolas, monospace; font-size: 12px; color: #F2B3C4; overflow-wrap: anywhere; }
  .btn { min-height: 40px; border-radius: 9px; border: 1px solid; font: 600 13px inherit; cursor: pointer; width: 100%; }
  .btn:hover { filter: brightness(1.12); }
  .wine { background: #7A1C38; border-color: #9B2A4B; color: #fff; }
  .dark { background: #222226; border-color: #3A3A42; color: #E7E7EA; }
  .ok { padding: 8px 10px; border-radius: 8px; background: #16291E; border: 1px solid #1F4D33; color: #6EE7A0; font-size: 12px; }
  .err { padding: 8px 10px; border-radius: 8px; background: #2E1517; border: 1px solid #5A2226; color: #FCA5A5; font-size: 12px; }
  button:focus-visible { outline: 2px solid #E38AA2; outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sam Poliwag Assist</h1>
  <p class="muted" id="where">…</p>

  <div id="need" hidden>
    <p class="muted" style="margin-bottom:8px">La barre n'est pas encore activée sur ce site. Chrome va vous demander l'autorisation une seule fois.</p>
    <button type="button" class="btn wine" id="btn-enable">Activer la barre sur ce site</button>
  </div>

  <div id="active" hidden>
    <div class="ok" style="margin-bottom:8px">✓ Barre active sur ce site — elle s'affiche en haut de la page.</div>
    <button type="button" class="btn dark" id="btn-toggle">Masquer la barre</button>
  </div>

  <div class="err" id="msg" hidden></div>
  <p class="muted">v<span id="ver">2.0.0</span> · données gardées dans Chrome uniquement</p>
  <p class="muted">By svmovo</p>
</div>
<script src="popup.js"></script>
</body>
</html>
